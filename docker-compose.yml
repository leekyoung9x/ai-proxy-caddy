services:
  opencode-proxy:
    image: caddy:2-alpine
    container_name: opencode-proxy
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8089:8089"
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:8087:8087"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - opencode_proxy_data:/data
      - opencode_proxy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - poki-net

  # XQAPI body injector: chèn routing (route lock) vào JSON body theo MODEL.
  # 9Router gọi thẳng http://xq-inject:8091, không cần domain/path prefix.
  xq-inject:
    image: python:3.12-alpine
    container_name: xq-inject
    restart: always
    command: ["python3", "/app/inject.py"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      PORT: "8091"
      UPSTREAM: "https://xqapi.com"
      MODEL_ROUTES_JSON: '{"deepseek-v4-flash":{"strategy":"auto","failover":"auto"},"deepseek-flash":{"strategy":"auto","failover":"auto","pin":false},"glm-5.3-flash":{"strategy":"auto","failover":false},"kimi-k3":{"strategy":"auto","failover":"auto"},"deepseek-v4.1-flash":{"strategy":"auto","failover":"auto"}}'
    volumes:
      - ./xq-inject/inject.py:/app/inject.py:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - poki-net

volumes:
  opencode_proxy_data:
    driver: local
  opencode_proxy_config:
    driver: local

networks:
  poki-net:
    external: true
    name: root_poki-net
